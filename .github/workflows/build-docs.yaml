name: Build & Deploy Docs

on:
  push:
    branches:
      - main
      - 0.2-dev
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yaml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the Flutter web deploy (build-web.yaml) so both workflows
# never push to gh-pages at the same time.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.168.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required for Hugo's enableGitInfo (last updated date)
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build docs
        working-directory: docs
        run: hugo build --gc --minify --logLevel warn

      # Reuse the existing gh-pages tree so the Flutter web app (/app) survives.
      - name: Prepare deploy directory
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          mkdir -p deploy
          if [ -d gh-pages/app ]; then cp -r gh-pages/app deploy/app; fi
          if [ -f gh-pages/CNAME ]; then cp gh-pages/CNAME deploy/CNAME; fi
          touch deploy/.nojekyll
          cp -r docs/public/. deploy/

      # The docs are published at the site root; keep_files is disabled so the
      # obsolete mike/mkdocs output under /docs is removed.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          keep_files: false
