name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - 0.2-dev
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.x'
  HUGO_VERSION: '0.168.0'

# Serialize with the docs deploy (build-docs.yaml) so both workflows never
# push to gh-pages at the same time.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version details
        id: version_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME}"
            VERSION_TYPE="tag"
            DEPLOY_PATH="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="${COMMIT_SHA}"
            VERSION_TYPE="commit"
            DEPLOY_PATH="latest"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_type=${VERSION_TYPE}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "deploy_path=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          DEPLOY_PATH="${{ steps.version_info.outputs.deploy_path }}"
          flutter build web --release --base-href "/Second/app/${DEPLOY_PATH}/"

      # Pull existing gh-pages so we can preserve deployed docs and existing versions
      - name: Pull existing gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add gh-pages origin/gh-pages || git worktree add gh-pages gh-pages || true
          mkdir -p deploy
          if [ -d gh-pages ]; then
            cp -r gh-pages/* deploy/ || true
          fi
          mkdir -p deploy/app

      # Copy Flutter build output to version subfolder and update Hugo Markdown
      - name: Update web deployment versions & generate Markdown
        run: |
          VERSION="${{ steps.version_info.outputs.version_name }}"
          TYPE="${{ steps.version_info.outputs.version_type }}"
          DEPLOY_PATH="${{ steps.version_info.outputs.deploy_path }}"
          
          mkdir -p "deploy/app/${DEPLOY_PATH}"
          rm -rf "deploy/app/${DEPLOY_PATH:?}"/*
          cp -r build/web/* "deploy/app/${DEPLOY_PATH}/"
          
          python3 -m pip install jinja2
          python3 web/manage_versions.py --deploy-dir deploy/app --docs-content-dir docs/content/app --version "${VERSION}" --type "${TYPE}"

      # Set up Go and Hugo to build documentation with Hextra
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo docs
        working-directory: docs
        run: hugo build --gc --minify --logLevel warn

      # Copy compiled Hugo site into deploy directory (updates /app/index.html via Hextra)
      - name: Merge Hugo docs into deploy
        run: |
          if [ -f gh-pages/CNAME ]; then cp gh-pages/CNAME deploy/CNAME; fi
          touch deploy/.nojekyll
          cp -r docs/public/. deploy/

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          keep_files: false
