name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - 0.2-dev
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.x'

# Serialize with the docs deploy (build-docs.yaml) so both workflows never
# push to gh-pages at the same time.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version details
        id: version_info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME}"
            VERSION_TYPE="tag"
          else
            VERSION_NAME="${COMMIT_SHA}"
            VERSION_TYPE="commit"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_type=${VERSION_TYPE}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          VERSION="${{ steps.version_info.outputs.version_name }}"
          flutter build web --release --base-href "/Second/app/${VERSION}/"

      # Pull existing gh-pages so we can preserve deployed docs and existing versions
      - name: Pull existing gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add gh-pages origin/gh-pages || git worktree add gh-pages gh-pages || true
          mkdir -p deploy
          if [ -d gh-pages ]; then
            cp -r gh-pages/* deploy/ || true
          fi
          mkdir -p deploy/app

      # Copy build output to version subfolder and update version manager
      - name: Update web deployment versions
        run: |
          VERSION="${{ steps.version_info.outputs.version_name }}"
          TYPE="${{ steps.version_info.outputs.version_type }}"
          
          mkdir -p "deploy/app/${VERSION}"
          rm -rf "deploy/app/${VERSION:?}"/*
          cp -r build/web/* "deploy/app/${VERSION}/"
          
          python3 web/manage_versions.py --deploy-dir deploy/app --version "${VERSION}" --type "${TYPE}"

      # Keep all other files (especially the docs) untouched
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
