name: Release Application

on:
  push:
    tags:
      - '*'

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1

  build_windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - name: Enable Windows Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release --verbose

      - name: Zip Windows Files
        run: |
          $VERSION="${{ github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "windows-x86_64-${VERSION}.zip"
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows-x86_64-${{ github.ref_name }}.zip

  build_linux:
    name: Build Linux App (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0 libasound2-dev \
            libopus-dev libogg-dev libvorbis-dev

      - name: Enable Linux Support
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Linux App
        run: |
          flutter build linux --release --verbose
          mkdir -p build/linux-release
          mv build/linux/x64/release/bundle/* build/linux-release/
        shell: bash

      - name: Zip Linux Files
        run: |
          VERSION="${{ github.ref_name }}"
          tar -czvf linux-x86_64-${VERSION}.tar.gz -C build/linux-release .
        shell: bash

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: linux-x86_64-${{ github.ref_name }}.tar.gz

  build_linux_arm:
    name: Build Linux App (ARM64)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0 libasound2-dev \
            libopus-dev libogg-dev libvorbis-dev

      - name: Setup Flutter from Source
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1
          cd flutter
          git fetch --depth 1 origin tag 3.47.8
          git checkout 3.47.8
          cd ..
          ./flutter/bin/flutter config --no-analytics
          ./flutter/bin/flutter precache

      - name: Enable Linux Support
        run: ./flutter/bin/flutter config --enable-linux-desktop

      - name: Install Flutter Dependencies
        run: ./flutter/bin/flutter pub get

      - name: Build Linux App
        run: |
          ./flutter/bin/flutter build linux --release --verbose
          mkdir -p build/linux-release
          mv build/linux/arm64/release/bundle/* build/linux-release/
        shell: bash

      - name: Zip Linux Files
        run: |
          VERSION="${{ github.ref_name }}"
          tar -czvf linux-arm64-${VERSION}.tar.gz -C build/linux-release .
        shell: bash

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm
          path: linux-arm64-${{ github.ref_name }}.tar.gz

  build_macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - name: Enable macOS Support
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release --verbose

      - name: Zip macOS Files
        run: |
          VERSION="${{ github.ref_name }}"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app macos-universal-${VERSION}.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: macos-universal-${{ github.ref_name }}.zip

  release:
    name: Create GitHub Release
    needs: [build_apk, build_windows, build_linux, build_linux_arm, build_macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts

      - name: Download Windows App from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts

      - name: Download Linux App from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts

      - name: Download Linux ARM App from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-arm
          path: artifacts

      - name: Download macOS App from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/app-release.apk.sha1
            artifacts/windows-x86_64-${{ github.ref_name }}.zip
            artifacts/linux-x86_64-${{ github.ref_name }}.tar.gz
            artifacts/linux-arm64-${{ github.ref_name }}.tar.gz
            artifacts/macos-x86_64-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}