baseURL: https://mercsmavs-msa.github.io/Second/
title: SECOND Documentation
enableRobotsTXT: true
enableInlineShortcodes: true
# Use the last Git commit date as the page's last modified date
enableGitInfo: true

defaultContentLanguage: en
languages:
  en:
    locale: en-us
    title: SECOND Documentation

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

disableKinds:
  - taxonomy
  - term

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: GitHub
      weight: 2
      url: https://github.com/MercsMavs-MSA/Second
      params:
        icon: github

params:
  description: >-
    SECOND is an attendance tracking app for students, mentors, coaches and
    volunteers. This is the official documentation for setup, installation,
    configuration and usage.

  externalLinkDecoration: true

  navbar:
    displayTitle: true
    displayLogo: true
    width: normal
    logo:
      path: media/logos/icon_144.png
      width: 28
      height: 28

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  # Search
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      tokenize: forward

  editURL:
    enable: true
    base: https://github.com/MercsMavs-MSA/Second/edit/main/docs/content

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: January 2, 2006

  # Display the author name of the last modified date
  displayUpdatedAuthor: false

  highlight:
    copy:
      enable: true
      display: hover

  imageZoom:
    enable: true

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
